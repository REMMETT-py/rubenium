# Builds Rubenium.exe on Windows and publishes it as a GitHub release whenever VERSION in Rubenium.py
# is a version that has not been released yet. Everyone's Rubenium then offers the update.
name: Release

on:
  push:
    branches: [main, build-test]
    paths: ["Rubenium.py", "swaps/**", "release_notes.txt", "Rubenium.spec", "installer.iss", "requirements.txt",
            ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the version from Rubenium.py
        id: ver
        shell: python
        run: |
          import os, re
          text = open("Rubenium.py", encoding="utf-8").read()
          version = re.search(r'^VERSION = "([0-9][0-9.]*)"', text, re.M).group(1)
          name = re.search(r'^VERSION_NAME = "([0-9][0-9.]*)"', text, re.M)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"name={name.group(1) if name else version}\n")
          print("version", version)

      - name: Already released?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "v${{ steps.ver.outputs.version }} already exists, nothing to do."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rubenium (PyInstaller with its starter program compiled here, not the shared prebuilt one)
        if: steps.exists.outputs.skip == '0'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          $piv = (python -c "import PyInstaller; print(PyInstaller.__version__)").Trim()
          git clone --depth 1 --branch "v$piv" https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP\pyi"
          Push-Location "$env:RUNNER_TEMP\pyi\bootloader"
          python ./waf distclean all
          if ($LASTEXITCODE -ne 0) { throw "bootloader build failed" }
          Pop-Location
          pip install --force-reinstall --no-deps "$env:RUNNER_TEMP\pyi"
          $boot = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'))"
          Write-Host "bootloader: $boot  $((Get-FileHash $boot).Hash)"
          python make_icon.py
          python make_version_info.py "${{ steps.ver.outputs.version }}"
          pyinstaller --noconfirm --clean Rubenium.spec
          if (-not (Test-Path dist\Rubenium\Rubenium.exe)) { throw "no dist\Rubenium\Rubenium.exe" }

      - name: Self-test the app on Windows (open every tab, both languages)
        if: steps.exists.outputs.skip == '0'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Rubenium\Rubenium.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Error "Self-test timed out"; exit 1 }
          $log = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Rubenium\rubenium.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit code $($p.ExitCode))"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "SELFTEST OK" -Quiet)) { Write-Error "No SELFTEST OK in the log"; exit 1 }

      - name: Build RubeniumSetup.exe
        if: steps.exists.outputs.skip == '0'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          & $iscc /Qp "/DVersion=${{ steps.ver.outputs.version }}" "/DVersionName=${{ steps.ver.outputs.name }}" installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "setup build failed"; exit 1 }
          Get-Item out\RubeniumSetup.exe | Format-List Name,Length

      - name: Test install, update and uninstall on Windows
        if: steps.exists.outputs.skip == '0'
        shell: pwsh
        run: |
          $log = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Rubenium\rubenium.log"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Rubenium"
          $setup = (Resolve-Path out\RubeniumSetup.exe).Path
          function Wait-Gone {
            Start-Sleep 4; $t = 0
            while ((Get-Process | Where-Object { $_.Name -like "Rubenium*" }) -and $t -lt 240) { Start-Sleep 2; $t += 2 }
            if (Get-Process | Where-Object { $_.Name -like "Rubenium*" }) {
              Get-Process | Where-Object { $_.Name -like "Rubenium*" } | Stop-Process -Force
              if (Test-Path $log) { Get-Content $log -Tail 60 }; Write-Error "Rubenium did not finish"; exit 1 }
          }
          function Need($text) {
            if (-not (Select-String -Path $log -Pattern $text -SimpleMatch -Quiet)) {
              if (Test-Path $log) { Get-Content $log -Tail 60 }; Write-Error "Not in the log: $text"; exit 1 }
          }

          Write-Host "1. Silent install (what an update does), then the installed app runs its self-test"
          Remove-Item $log -ErrorAction SilentlyContinue
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/RUBENIUMARGS=--selftest"
          Wait-Gone; Need "SELFTEST OK"
          if (-not (Test-Path "$app\Rubenium.exe")) { Write-Error "Not installed in $app"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Rubenium.lnk")) { Write-Error "No Start menu entry"; exit 1 }

          Write-Host "2. Update from inside the installed app: it starts the setup and closes; the new version starts"
          Remove-Item $log -ErrorAction SilentlyContinue
          Start-Process "$app\Rubenium.exe" -ArgumentList "--selftest-update=$setup"
          Wait-Gone; Need "UPDATE SETUP STARTED"; Need "SELFTEST OK"

          Write-Host "3. Uninstall removes the app and its start-with-Windows entry"
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Rubenium" -Value "`"$app\Rubenium.exe`"" -Force | Out-Null
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$app\Rubenium.exe") { Write-Error "Uninstall left the app behind"; exit 1 }
          if (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Rubenium" -ErrorAction SilentlyContinue) {
            Write-Error "Uninstall left the start-with-Windows entry"; exit 1 }
          Write-Host "Install, update from the app and uninstall all work."

      - name: Scan with Microsoft Defender
        if: steps.exists.outputs.skip == '0'
        shell: pwsh
        run: |
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Host "signature update failed: $_" }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          foreach ($f in @("out\RubeniumSetup.exe", "dist\Rubenium\Rubenium.exe")) {
            & $mp -Scan -ScanType 3 -File (Resolve-Path $f).Path -DisableRemediation
            if ($LASTEXITCODE -eq 2) { Write-Error "Defender flags $f"; exit 1 }
          }

      - name: Collect the release files
        if: steps.exists.outputs.skip == '0'
        shell: bash
        run: |
          cp Rubenium.py out/
          python -c "import shutil; shutil.make_archive('out/swaps', 'zip', '.', 'swaps')"
          cd out
          for f in RubeniumSetup.exe Rubenium.py swaps.zip; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish the release
        if: steps.exists.outputs.skip == '0' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" out/* --title "Rubenium ${{ steps.ver.outputs.name }}" --notes-file release_notes.txt --latest
