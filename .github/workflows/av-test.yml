name: AV test
on:
  push:
    branches: [av-test]
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Defender status
        shell: pwsh
        run: |
          Get-MpComputerStatus | Format-List AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion,IsTamperProtected
          Get-MpPreference | Format-List MAPSReporting,SubmitSamplesConsent,DisableRealtimeMonitoring
          try { Update-MpSignature -ErrorAction Stop; "signatures updated" } catch { "signature update failed: $_" }
          Get-MpComputerStatus | Format-List AntivirusSignatureVersion,AntivirusSignatureLastUpdated
      - name: Download the current release exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan | Out-Null
          Invoke-WebRequest "https://github.com/REMMETT-py/rubenium/releases/download/v4.0.0/Rubenium.exe" -OutFile scan\old.exe
      - name: Build with the stock bootloader
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python make_icon.py
          python make_version_info.py 1.0.0
          pyinstaller --noconfirm --clean Rubenium.spec
          cp dist/Rubenium.exe scan/stock.exe
      - name: Build with a bootloader compiled from source
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip uninstall -y pyinstaller
          python -m pip cache remove pyinstaller
          python -m pip install --no-binary=pyinstaller pyinstaller
          $env:QT_QPA_PLATFORM = "offscreen"
          pyinstaller --noconfirm --clean Rubenium.spec
          Copy-Item dist\Rubenium.exe scan\custom.exe
      - name: Self-test the custom build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "scan\custom.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); exit 1 }
          exit $p.ExitCode
      - name: Scan old release
        id: old
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\scan\old.exe" -DisableRemediation
          Write-Host "exit $LASTEXITCODE"; exit $LASTEXITCODE
      - name: Scan stock build
        id: stock
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\scan\stock.exe" -DisableRemediation
          Write-Host "exit $LASTEXITCODE"; exit $LASTEXITCODE
      - name: Scan custom build
        id: custom
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\scan\custom.exe" -DisableRemediation
          Write-Host "exit $LASTEXITCODE"; exit $LASTEXITCODE
      - name: Threats seen
        shell: pwsh
        run: |
          Get-MpThreatDetection | Format-List
          Get-MpThreat | Format-List
          Get-FileHash scan\*.exe
