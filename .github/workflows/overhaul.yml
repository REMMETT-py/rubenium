# Checks for the 8.0 overhaul. Runs only on the overhaul-8 branch.
# It never builds an installer, never publishes, never touches releases or tags, and only reads the live server
# (the self-test runs the app logged out, like a fresh install).
name: overhaul-checks
on:
  push:
    branches: [overhaul-8]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overhaul-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Rubenium.py overhaul/db/*.py overhaul/perf/*.py
      - name: Ruff (real errors only, no style rules)
        run: |
          pip install ruff==0.16.9
          ruff check --select E9,F63,F7,F82 Rubenium.py overhaul tests

  selftest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -r requirements.txt
      - name: Self-test (every tab, both languages)
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/Documents"
          log="$HOME/Documents/Rubenium/rubenium.log"
          code=0; timeout 300 python Rubenium.py --selftest || code=$?
          tail -n 60 "$log" || true
          [ "$code" = 0 ] || { echo "::error::Self-test exit code $code"; exit 1; }
          grep -q "SELFTEST OK" "$log" || { echo "::error::No SELFTEST OK in the log"; exit 1; }

  selftest-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Self-test from source (every tab, both languages; --console keeps it in this process, not pythonw)
        shell: pwsh
        run: |
          $log = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Rubenium\rubenium.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath python -ArgumentList "Rubenium.py","--selftest","--console" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); if (Test-Path $log) { Get-Content $log -Tail 60 }; Write-Error "Self-test timed out"; exit 1 }
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit code $($p.ExitCode))"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "SELFTEST OK" -Quiet)) { Write-Error "No SELFTEST OK in the log"; exit 1 }

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y -q postgresql-client
          pip install "psycopg[binary]>=3.2"
      - name: Server tests (repo migrations; tests that need the private live snapshot are skipped)
        run: python overhaul/db/run_tests.py tests/db
